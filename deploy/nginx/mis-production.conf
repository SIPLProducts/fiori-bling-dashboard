# MIS Portal — PRODUCTION environment
# Plain HTTP only. No SSL / 443 block, no Certbot, no HTTPS redirect.
# TLS (if any) is terminated upstream (load balancer / existing reverse proxy).
#
# The portal is a static SPA: Nginx serves index.html + assets straight from
# /opt/MIS_Projects/Production/frontend/dist. There is no app container.
#
# Install:
#   sudo cp mis-production.conf /etc/nginx/sites-available/mis-production.conf
#   sudo ln -s /etc/nginx/sites-available/mis-production.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream mis_p_middleware { server 127.0.0.1:3010; keepalive 16; }
upstream mis_p_backend    { server 127.0.0.1:5001; keepalive 16; }
upstream mis_p_supabase   { server 127.0.0.1:9010; keepalive 16; }
upstream mis_p_studio     { server 127.0.0.1:9012; keepalive 8;  }

map $http_upgrade $connection_upgrade_p {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name mis.siplproducts.com;
    # Alternative: serve on bare IP / any host instead of a domain name
    # server_name _;

    access_log /var/log/nginx/mis-production.access.log;
    error_log  /var/log/nginx/mis-production.error.log warn;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade_p;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Static frontend build — upload the contents of dist/ here
    root  /opt/MIS_Projects/Production/frontend/dist;
    index index.html;

    # Health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Middleware service — 3010
    location /middleware/ {
        proxy_pass http://mis_p_middleware/;
    }

    # Backend service — 5001
    location /backend/ {
        proxy_pass http://mis_p_backend/;
    }

    # Supabase API gateway (Kong) — 9010
    location /supabase/ {
        proxy_pass http://mis_p_supabase/;
        proxy_read_timeout 300s;   # realtime / long polling
    }

    # Supabase Studio — 9012
    # Studio has NO built-in login. Protect it with HTTP basic auth:
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.mis-studio supabase
    location /studio/ {
        proxy_pass http://mis_p_studio/;
        auth_basic "MIS Studio";
        auth_basic_user_file /etc/nginx/.mis-studio;
        # Restrict to the office network if desired:
        # allow 10.0.0.0/8; deny all;
    }

    # Hashed build assets — safe to cache forever
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback — every app route resolves to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
