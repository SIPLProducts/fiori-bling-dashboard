# MIS Portal — QUALITY environment
# Plain HTTP only. No SSL / 443 block, no Certbot, no HTTPS redirect.
# TLS (if any) is terminated upstream (load balancer / existing reverse proxy).
#
# Install:
#   sudo cp mis-quality.conf /etc/nginx/sites-available/mis-quality.conf
#   sudo ln -s /etc/nginx/sites-available/mis-quality.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream mis_q_app        { server 127.0.0.1:8081; keepalive 32; }
upstream mis_q_middleware { server 127.0.0.1:3002; keepalive 16; }
upstream mis_q_backend    { server 127.0.0.1:5000; keepalive 16; }
upstream mis_q_supabase   { server 127.0.0.1:8000; keepalive 16; }
upstream mis_q_studio     { server 127.0.0.1:8082; keepalive 8;  }

map $http_upgrade $connection_upgrade_q {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name quality.siplproducts.com;
    # Alternative: serve on bare IP / any host instead of a domain name
    # server_name _;

    access_log /var/log/nginx/mis-quality.access.log;
    error_log  /var/log/nginx/mis-quality.error.log warn;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade_q;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Health check (app root)
    location = /healthz {
        proxy_pass http://mis_q_app/;
        access_log off;
    }

    # Middleware service — 3002
    location /middleware/ {
        proxy_pass http://mis_q_middleware/;
    }

    # Backend service — 5000
    location /backend/ {
        proxy_pass http://mis_q_backend/;
    }

    # Supabase API gateway (Kong) — 8000
    location /supabase/ {
        proxy_pass http://mis_q_supabase/;
        proxy_read_timeout 300s;   # realtime / long polling
    }

    # Supabase Studio — 8082
    # Studio has NO built-in login. Protect it with HTTP basic auth:
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.mis-studio supabase
    location /studio/ {
        proxy_pass http://mis_q_studio/;
        auth_basic "MIS Studio";
        auth_basic_user_file /etc/nginx/.mis-studio;
        # Restrict to the office network if desired:
        # allow 10.0.0.0/8; deny all;
    }

    # Static build assets — served directly from frontend/dist with long cache
    root /opt/MIS_Projects/Quality/frontend/dist;

    location /_build/ {
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Application (TanStack Start SSR + server functions) — 8081
    # Try to serve static files from frontend/dist first, then fall back to the app server.
    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        proxy_pass http://mis_q_app;
    }
}
