# MIS Portal — PRODUCTION stack (isolated network + volumes)
# Run from /opt/MIS_Projects/Production/backend:
#   docker compose --env-file .env -f docker-compose.production.yml up -d --build
name: mis-production

networks:
  mis_production:
    name: mis_production_net

volumes:
  p_db_data:
  p_storage_data:

services:
  db:
    image: supabase/postgres:15.8.1.049
    container_name: mis_p_db
    restart: unless-stopped
    networks: [mis_production]
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - p_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: supabase/postgres:15.8.1.049
    container_name: mis_p_migrate
    networks: [mis_production]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../supabase/migrations:/migrations:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for f in $$(ls /migrations/*.sql | sort); do
          echo "==> applying $$f"
          psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "migrations complete"
    restart: "no"

  auth:
    image: supabase/gotrue:v2.170.0
    container_name: mis_p_auth
    restart: unless-stopped
    networks: [mis_production]
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: mis_p_rest
    restart: unless-stopped
    networks: [mis_production]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  realtime:
    image: supabase/realtime:v2.34.7
    container_name: mis_p_realtime
    restart: unless-stopped
    networks: [mis_production]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"

  storage:
    image: supabase/storage-api:v1.19.3
    container_name: mis_p_storage
    restart: unless-stopped
    networks: [mis_production]
    depends_on:
      db: { condition: service_healthy }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: production
      REGION: local
      GLOBAL_S3_BUCKET: stub
      GLOBAL_S3_PROTOCOL: http
    volumes:
      - p_storage_data:/var/lib/storage

  meta:
    image: supabase/postgres-meta:v0.86.0
    container_name: mis_p_meta
    restart: unless-stopped
    networks: [mis_production]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  kong:
    image: kong:2.8.1
    container_name: mis_p_kong
    restart: unless-stopped
    networks: [mis_production]
    depends_on: [auth, rest, realtime, storage, meta]
    ports:
      - "127.0.0.1:9010:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml:ro

  studio:
    image: supabase/studio:20250224-d10db0f
    container_name: mis_p_studio
    restart: unless-stopped
    networks: [mis_production]
    depends_on: [meta, kong]
    ports:
      - "127.0.0.1:9012:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: SIPL
      DEFAULT_PROJECT_NAME: MIS Production
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

# NOTE: there is no frontend container. The portal is a static build:
# upload the contents of your local `dist/` folder to
# /opt/MIS_Projects/Production/frontend/dist and Nginx serves it directly
# (see deploy/nginx/mis-production.conf).
